<!-- Centralized agent configuration, pushed by the Wazuh manager to the agents in the "default" group.
     Place at /var/ossec/etc/shared/default/agent.conf on the WAZUH SERVER, then run:
       sudo /var/ossec/bin/verify-agent-conf -->
<agent_config>
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ps008</directories>
  </syscheck>
</agent_config>
